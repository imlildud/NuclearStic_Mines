<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nuclear Stic Mines Retrash'd</title>
<link rel="icon" href="assets/hud/nuclearlogo.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&display=swap');

body {
    margin: 0;
    height: 100vh;
    background: url('assets/hud/NuclearSticMines.png') no-repeat center center fixed;
    background-size: cover;
    font-family: 'Special Elite', cursive;
    color: black;
    display: flex;
    justify-content: center;
    align-items: center;
}

.logo {
    width: 320px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 10px;
    color: #ffccaa;
    margin-bottom: 25px;
}

.legacy-button {
    position: absolute;
    top: 140px;
    left: -80px;
    z-index: 10;
    width: 180px;
    height: 70px;
    background: url('assets/hud/menu/legacy.png') no-repeat center;
    background-size: contain;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.15s ease;
}

.daily-button {
    width: 310px;
    height: 140px;
    margin: 15px auto;
    background: url('assets/hud/menu/daily.png') no-repeat center;
    background-size: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-left: 100px;
    font-size: 22px;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.15s ease;
}

.custom-button {
    width: 310px;
    height: 140px;
    margin: 15px auto;
    background: url('assets/hud/menu/custom.png') no-repeat center;
    background-size: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-left: 100px;
    font-size: 22px;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.15s ease;
}

.menu-button:hover {
    transform: scale(1.05);
}

.top-bar {
    position: relative;
    display: inline-block
}

.bottom-row {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 5px;
}

.diary-button {
    width: 210px;
    height: 100px;
    background: url('assets/hud/menu/diary.png') no-repeat center;
    background-size: contain;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.15s ease;
}

.option-button {
    width: 210px;
    height: 100px;
    background: url('assets/hud/menu/options.png') no-repeat center;
    background-size: contain;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.15s ease;
}

.legacy-button:hover {
    filter: brightness(1,25) drop-shadow(0 0 8px rgba(255,255,200,0,7));
}
.legacy-button:active {
    filter: brightness(0.75);
    transform: scale(0.95);
}

.daily-button:hover {
    filter: brightness(1,25) drop-shadow(0 0 8px rgba(255,255,200,0,7));
}
.daily-button:active {
    filter: brightness(0.75);
    transform: scale(0.95);
}

.custom-button:hover {
    filter: brightness(1,25) drop-shadow(0 0 8px rgba(255,255,200,0,7));
}
.custom-button:active {
    filter: brightness(0.75);
    transform: scale(0.95);
}

.diary-button:hover {
    filter: brightness(1,25) drop-shadow(0 0 8px rgba(255,255,200,0,7));
}
.diary-button:active {
    filter: brightness(0.75);
    transform: scale(0.95);
}

.option-button:hover {
    filter: brightness(1,25) drop-shadow(0 0 8px rgba(255,255,200,0,7));
}
.option-button:active {
    filter: brightness(0.75);
    transform: scale(0.95);
}


</style>
</head>

<body>

<div class="overlay">
    <div class="top-bar">
        <img src="assets/hud/nuclearlogo.png" class="logo" alt="Game Logo">

        <div class="legacy-button">
        </div>
    </div>

    <div class="daily-button">
        Daily Mission
    </div>

    <div class="custom-button">
        Custom Mission
    </div>

    <div class="bottom-row">
        <div class="diary-button">
        </div>
        <div class="option-button">
        </div>
    </div>

</div>
</body>
</html>
