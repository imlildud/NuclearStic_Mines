<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nuclear-Stic Mines Retrash'd</title>

    <!-- Favicon -->
    <link rel="icon" href="assets/hud/nuclearlogo.png">

    <!-- Styles -->
    <link rel="stylesheet" href="css/menu.css">

    <!-- Scripts -->
    <script type="module" src="js/main/Menu.js"></script>
</head>

<body>
    <!-- ====================================================== -->
    <!-- =================== WELCOME SCREEN ==================== -->
    <!-- ====================================================== -->

    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-card">
            <img src="assets/hud/menu/welcome.png" class="welcome-bg" alt="Welcome">
            <div class="welcome-content">
                
                <!-- Welcome Panel (ID Card for returning players) -->
                <div id="welcome-panel" class="welcome-panel" style="display: none;">
                    <div class="id-card-container">
                        <img src="assets/hud/menu/idcard.png" class="id-card-bg" alt="ID Card">
                        <div class="id-card-content">
                            <div class="id-card-avatar">
                                <img id="id-card-avatar-img" class="id-card-avatar-img" src="assets/hud/menu/icons/icon1.png" alt="Avatar">
                                <img id="id-card-edit-btn" class="id-card-edit-btn" src="assets/hud/menu/edit.png" alt="Edit">
                            </div>
                            <div id="id-card-name" class="id-card-name"></div>
                            <div id="id-card-level" class="id-card-level"></div>
                            <div class="id-card-badges">
                                <div id="id-card-record-number" class="id-card-record-number"></div>
                                <img id="id-card-legacy-badge" class="id-card-legacy-badge" src="assets/hud/badges/paper.png" alt="Legacy">
                                <div class="id-card-streak-wrapper">
                                    <img src="assets/hud/badges/calendar.png" class="id-card-streak-frame" alt="Frame">
                                    <span id="id-card-streak-number" class="id-card-streak-number">0</span>
                                    <img id="id-card-streak-fire" class="id-card-streak-fire" src="assets/hud/badges/fire0.png" alt="Fire">
                                </div>
                            </div>
                            <div class="id-card-hardcore-wrapper">
                                    <img src="assets/hud/menu/hardcore.png" class="id-card-hardcore-badge" alt="Frame">
                                    <span id="id-card-hardcore-number" class="id-card-hardcore-number">0</span>
                            </div>
                        </div>
                    </div>
                    <!-- ID Card specific buttons -->
                    <div class="id-card-buttons">
                        <button id="welcome-play" class="welcome-btn welcome-yes"></button>
                        <button id="welcome-delete" class="welcome-btn welcome-delete"></button>
                    </div>
                </div>
                
                <!-- Avatar Selection Panel (first time or edit) -->
                <div id="avatar-panel" class="avatar-panel" style="display: none;">
                    <div id="avatar-prompt" class="welcome-text"></div>
                    <div class="avatar-grid" id="avatar-grid">
                        <img src="assets/hud/menu/icons/icon1.png" class="avatar-option" data-avatar="1">
                        <img src="assets/hud/menu/icons/icon2.png" class="avatar-option" data-avatar="2">
                        <img src="assets/hud/menu/icons/icon3.png" class="avatar-option" data-avatar="3">
                        <img src="assets/hud/menu/icons/icon4.png" class="avatar-option" data-avatar="4">
                        <img src="assets/hud/menu/icons/icon5.png" class="avatar-option" data-avatar="5">
                        <img src="assets/hud/menu/icons/icon6.png" class="avatar-option" data-avatar="6">
                    </div>
                    <button id="avatar-confirm" class="welcome-btn welcome-yes"></button>
                </div>
                
                <!-- Name Panel (first time players) -->
                <div id="name-panel" class="name-panel" style="display: none;">
                    <div id="name-prompt" class="welcome-text"></div>
                    <input type="text" id="username-input" class="welcome-input" maxlength="20" autocomplete="off">
                    <button id="name-continue" class="welcome-btn welcome-yes"></button>
                </div>
                
                <!-- Tutorial Prompt Panel -->
                <div id="tutorial-panel" class="tutorial-panel" style="display: none;">
                    <div id="tutorial-question" class="welcome-text"></div>
                    <div class="welcome-buttons">
                        <button id="welcome-yes" class="welcome-btn welcome-yes"></button>
                        <button id="welcome-no" class="welcome-btn welcome-no"></button>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- ====================================================== -->
    <!-- ===================== MAIN MENU ====================== -->
    <!-- ====================================================== -->

    <!-- Background overlay filter -->
    <div class="filter"></div>

    <!-- Main Menu Overlay Container -->
    <div class="overlay">

        <!-- Top Left Corner - ID Card Button -->
        <img src="assets/hud/menu/lilidcard.png" class="id-card-toggle-btn" id="id-card-toggle-btn" alt="ID Card" style="display: none;">

        <!-- Bottom Left Corner Logo -->
        <img src="assets/hud/cloudcon.png" class="cloud" alt="CloudToons">

        <!-- Bottom Right Corner Logo -->
        <div class="version">
            v1.0.2
        </div>

        <!-- ================= HEADER SECTION ================= -->
        <div class="top-bar">

            <!-- Main Game Logo -->
            <img src="assets/hud/nuclearlogo.png" class="logo" alt="Game Logo">

            <!-- Legacy Mode Toggle Button -->
            <div class="legacy-button"></div>

        </div>

        <!-- ================= GAME MODE BUTTONS ================= -->
        <!-- Daily Mission Button -->
        <div id="daily-button" class="daily-button"></div>

        <!-- Custom Mission Button -->
        <div id="custom-button" class="custom-button"></div>

        <!-- ================= BOTTOM ACTION BUTTONS ================= -->
        <div class="bottom-row">

            <!-- Diary / Stats Button -->
            <div class="diary-button"></div>

            <!-- Options / Settings Button -->
            <div class="option-button"></div>

        </div>

    </div>

    <!-- ====================================================== -->
    <!-- =================== PUNCHCARD OVERLAY ================= -->
    <!-- ====================================================== -->

    <div id="punchcard-screen">

        <!-- Punchcard Main Container -->
        <div class="punchcard">

            <!-- Punchcard Background Base Image -->
            <img src="assets/hud/punchcard/punchcard.png"
                 class="pc-base"
                 alt="Punchcard Base">

            <!-- ================= HEADER ================= -->
            <div class="puncheader">

                <!-- Punchcard Titles -->
                <img src="assets/hud/punchcard/daily punch.png"
                     class="pc-title"
                     alt="Punchcard Title">

                <img src="assets/hud/punchcard/custom punch.png"
                     class="pct-title"
                     alt="Custom Title">

                <!-- Date Note Icon -->
                <img src="assets/hud/punchcard/note.png"
                     class="pc-date"
                     alt="Punchcard Date">

                <!-- Dynamic Date Text -->
                <div id="pc-date-note" class="pc-date-note"></div>

                <!-- Close Button -->
                <img src="assets/hud/punchcard/close.png"
                     class="pc-close"
                     alt="Close Punchcard">

            </div>

            <!-- ================= CONFIG SECTIONS ================= -->

            <!-- Character Selection -->
            <div class="pc-char">
                <div id="pc-label-character" class="pc-label">Character</div>
                <img id="pcCharacter">

                <!-- Legacy Mode Character Dropdown -->
                <select id="legacy-character-select">
                    <option value="chef">Chef</option>
                    <option value="mosquito">Mosquito</option>
                    <option value="mommy">Mommy</option>
                    <option value="scout">Scout</option>
                </select>

                <!-- Custom Mode Character Dropdown -->
                <select id="custom-character-select">
                    <option value="chef">Chef</option>
                    <option value="mosquito">Mosquito</option>
                    <option value="mommy">Mommy</option>
                    <option value="scout">Scout</option>
                </select>
            </div>

            <!-- Grid Size Selection -->
            <div class="pc-size">
                <div id="pc-label-size" class="pc-label">Size</div>
                <img id="pcSize">

                <select id="custom-size-select">
                    <option value="8">Small</option>
                    <option value="12">Medium</option>
                    <option value="16">Large</option>
                    <option value="20">Xtra-Large</option>
                    <option value="24">Ultra-Large</option>
                </select>
            </div>

            <!-- Hazards Count Selection -->
            <div class="pc-hazards">
                <div id="pc-label-hazards" class="pc-label">Hazards</div>
                <img id="pcHazards">

                <select id="custom-hazards-select">
                    <option value="1">Low</option>
                    <option value="5">Medium</option>
                    <option value="8">High</option>
                    <option value="12">Xtra-High</option>
                    <option value="20">Ultra-High</option>
                    <option value="30">Nsanely-High</option>
                </select>
            </div>

            <!-- Obstacles Count Selection -->
            <div class="pc-obstacles">
                <div id="pc-label-obstacles" class="pc-label">Obstacles</div>
                <img id="pcObstacles">

                <select id="custom-obstacles-select">
                    <option value="1">Low</option>
                    <option value="3">Medium</option>
                    <option value="5">High</option>
                    <option value="10">Xtra-High</option>
                    <option value="15">Ultra-High</option>
                    <option value="30">Nsanely-High</option>
                </select>
            </div>

            <!-- Goals / Wanted Count Selection -->
            <div class="pc-wanted">
                <div id="pc-label-wanted" class="pc-label">Wanted:</div>
                <img id="pcWanted">

                <select id="custom-wanted-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <!-- Environment Zone Selection -->
            <div class="pc-zone">
                <div id="pc-label-zone" class="pc-label">Zone</div>
                <img id="pcZone">

                <select id="custom-zone-select">
                    <option value="backyard">Backyard</option>
                    <option value="desert">Desert</option>
                    <option value="snow">Snow</option>
                    <option value="ash">Ash</option>
                </select>
            </div>

            <!-- ================= SEED LABEL ================= -->
            <div id="pc-seed-label" class="pc-seed-label-top">Seed: ---</div>

            <!-- ================= LEGACY BADGE SECTION ================= -->
            <div class="legacy-badge-container">
                <div class="badge-item">
                    <div class="badge-label" id="legacy-record-label">Record: 0</div>
                    <img id="legacy-record-badge" class="badge-img" src="assets/hud/badges/paper.png" alt="Record Badge">
                </div>
            </div>

            <!-- ================= DAILY STREAK BADGE SECTION ================= -->
            <div class="daily-badge-container" id="daily-badge-container" style="display: none;">
                <div class="daily-streak-wrapper">
                    <img id="daily-streak-frame" class="badge-img" src="assets/hud/badges/calendar.png" alt="Frame">
                    <div id="daily-streak-number" class="daily-streak-number">0</div>
                    <img id="daily-streak-fire" class="daily-fire-img" src="assets/hud/badges/fire0.png" alt="Fire">
                </div>
            </div>

            <!-- ================= SEED BUTTON ================= -->
            <div class="pc-seed-button-container" id="pc-seed-button-container" style="display: none;">
                <img src="assets/hud/punchcard/seed.png" class="pc-seed-btn" id="pc-seed-btn" alt="Set Seed">
            </div>

            <!-- ================= CUSTOM DICE BADGE ================= -->
            <div class="custom-dice-container" id="custom-dice-container" style="display: none;">
                <img src="assets/hud/punchcard/random.png" class="custom-dice-btn" id="custom-dice-btn" alt="Randomize">
            </div>
            
            <!-- ================= ACTIONS ================= -->

            <!-- Start Game Button -->
            <img src="assets/hud/punchcard/ready.png"
                 class="pc-start"
                 id="pcStart"
                 alt="Start Game">

        </div>

    </div>

    <!-- ====================================================== -->
    <!-- =================== MODAL DIALOG ====================== -->
    <!-- ====================================================== -->

    <div id="modal-dialog" class="welcome-screen" style="display: none; z-index: 60000;">
        <div class="welcome-card">
            <img src="assets/hud/menu/welcome.png" class="welcome-bg" alt="Dialog">
            <div class="welcome-content">
                <div id="modal-text" class="welcome-text"></div>
                <div class="welcome-buttons">
                    <button id="modal-ok" class="welcome-btn welcome-yes">OK</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
