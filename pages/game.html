<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nuclear-Stic Mines - Game</title>

     <!-- Favicon -->
    <link rel="icon" href="../assets/hud/nuclearlogo.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../css/game.css">
</head>

<body>

    <!-- ====================================================== -->
    <!-- ===================== HUD WRAPPER ===================== -->
    <!-- ====================================================== -->

    <!-- Main container for all HUD elements -->
    <div class="hud-main-wrapper">

        <!-- ================= MOVEMENT CONTROLS (WASD Style) ================= -->
        <div class="touch-movement">
            <img src="../assets/hud/game/control/w.png" class="touch-btn touch-w" data-dir="Up">
            <img src="../assets/hud/game/control/a.png" class="touch-btn touch-a" data-dir="Left">
            <img src="../assets/hud/game/control/s.png" class="touch-btn touch-s" data-dir="Down">
            <img src="../assets/hud/game/control/d.png" class="touch-btn touch-d" data-dir="Right">
        </div>

        <!-- ================= FLAG CONTROLS (Arrow Keys Style) ================= -->
        <div class="touch-flags">
            <img src="../assets/hud/game/control/up.png" class="flag-btn flag-up" data-flag="Up">
            <img src="../assets/hud/game/control/left.png" class="flag-btn flag-left" data-flag="Left">
            <img src="../assets/hud/game/control/down.png" class="flag-btn flag-down" data-flag="Down">
            <img src="../assets/hud/game/control/right.png" class="flag-btn flag-right" data-flag="Right">
        </div>

        <!-- ================= GROUP 1: Character and Alerts (Top Left) ================= -->
        <div class="hud-container hud-character-group">
            <!-- Character Icon -->
            <img id="hud-character-icon" class="hud-icon-character" src="../assets/hud/game/charactericon/chef.png" alt="Character">

            <!-- Geohazard Alert Icon -->
            <img id="hud-geohaz-alert" class="hud-geohaz-alert" style="display: none;">

            <!-- Geoobstacle Alert Icon -->
            <img id="hud-geoobs-alert" class="hud-geoobs-alert" style="display: none;">

            <!-- Tired Status Icon -->
            <img id="hud-tired-icon" class="hud-tired-icon" style="display: none;" src="../assets/hud/game/stats/tired.png">

            <!-- Criticized Status Icon -->
            <img id="hud-criticized-icon" class="hud-criticized-icon" style="display: none;" src="../assets/hud/game/stats/criticized.png">

            <!-- Pause button -->
            <img id="pause-btn" class="pause-btn" src="../assets/hud/game/control/pause.png" alt="Pause" style="display: block;">
        </div>

        <!-- ================= GROUP 2: Health (Below Character) ================= -->
        <div class="hud-container hud-health-group">
            <!-- Health Bar Image -->
            <div id="hud-health-bar" class="hud-health-bar" alt="Health Bar">
                <img id="hud-health-bar" class="hud-health-bar" src="../assets/hud/game/stats/barlife.png" alt="Health Bar">
                <!-- Health Numeric Text -->
                <div id="hud-health-text" class="hud-health-text">5</div>
            </div>
            <!-- Health Icon -->
            <img id="hud-health-icon" class="hud-health-icon" src="../assets/hud/game/stats/fulllife.png" alt="Health">
        </div>

        <!-- ================= ROW 3: Flags and Rescued Stats (Below Health) ================= -->
        <div class="hud-stats-row">

            <!-- Flags Remaining Container -->
            <div class="hud-container hud-flags-group">
                <img id="hud-flags-icon" class="hud-flags-icon" src="../assets/hud/game/stats/remainingflags.png" alt="Flags">
                <div id="hud-flags-text" class="hud-flags-text">0</div>
            </div>

            <!-- Rescued Count Container -->
            <div class="hud-container hud-rescued-group">
                <img id="hud-rescued-icon" class="hud-rescued-icon" src="../assets/hud/game/stats/rescued.png" alt="Rescued">
                <div id="hud-rescued-text" class="hud-rescued-text">0</div>
            </div>

        </div>

        <!-- ================= TOP CENTER: Current Tile & Heightometer ================= -->
        <div class="hud-top-center-group">
            <!-- Height-O-Meter -->
            <div class="hud-heightometer-group">
                <img id="hud-heightometer-icon" class="hud-icon-heightometer" src="../assets/hud/game/stats/heightometer.png" alt="heightometer">
                <div id="hud-heightometer-number" class="hud-heightometer-number">0</div>
            </div>

            <!-- Current Tile -->
            <div class="hud-tile-group">
                <img id="hud-tilemarin-icon" class="hud-icon-tilemargin" src="../assets/hud/game/stats/currentile.png" alt="margin">
                <img id="hud-tile-icon" class="hud-icon-tile" alt="currentile">
            </div>
        </div>

        <!-- Coords -->
            <div class="hud-coordinates-container">
                <div id="coords-text" class="coords-text">[0,0]</div>
            </div>
    </div>

    <!-- ====================================================== -->
    <!-- ================= GAME CANVAS ======================== -->
    <!-- ====================================================== -->

    <!-- Background overlay filter -->
    <div class="filter"></div>

    <!-- Main game rendering canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- ====================================================== -->
    <!-- ================= SCRIPTS & DEBUG ==================== -->
    <!-- ====================================================== -->

    <!-- Game Logic Module -->
    <script type="module" src="../js/main/Game.js"></script>

    <!-- Debug Panel Container -->
    <div id="debugPanel"></div>

    <!-- ====================================================== -->
    <!-- ================= TUTORIAL RADIO ====================== -->
    <!-- ====================================================== -->

    <div class="tutorial-radio-container">
        <img id="tutorial-radio" class="tutorial-radio" src="../assets/hud/game/radio/walkie.png" alt="Radio" style="display: none;">
        <div id="tutorial-bubble" class="tutorial-bubble" style="display: none;">
            <div id="tutorial-text" class="tutorial-text"></div>
        </div>
    </div>

    <!-- ====================================================== -->
    <!-- ================= SCOREBOARD OVERLAY ================= -->
    <!-- ====================================================== -->

    <div id="scoreboard-overlay" class="scoreboard-overlay">
        <div class="hud-scoreboard">
            <div class="scoreboard-labels">
                <div id="score-label-rescued" class="label-row">Rescued</div>
                <div id="score-labeled" class="label-row">Marked Hazard</div>
                <div id="score-label-difficulty" class="label-row">Difficulty Bonus</div>
                <div id="score-label-deaths" class="label-row">Deaths Penalty</div>
                <div id="score-label-failed" class="label-row">Failed Penalty</div>
                <div id="score-label-damage" class="label-row">Damage Penalty</div>
            </div>

            <div class="scoreboard-values">
                <div class="value-row" id="rescued-score">0/0</div>
                <div class="value-row" id="marked-score">0/0</div>
                <div class="value-row" id="size-score">0</div>
                <div class="value-row" id="deaths-score">0</div>
                <div class="value-row" id="failed-score">0</div>
                <div class="value-row" id="hurt-score">0</div>
            </div>

            <!-- Total Score Display -->
            <div id="total-score" class="total-score">0/0</div>

            <!-- Grade / Rank Image -->
            <img id="score-grade" class="grade" src="../assets/hud/game/gameover/f.png" alt="grade">

            <!-- Action Buttons Row -->
            <div class="scoreboard-button-row">
                <img id="score-random" class="random-btn" src="../assets/hud/game/gameover/random.png" alt="random" style="display: none;">
                <img id="score-continue" class="continue-btn" src="../assets/hud/game/gameover/continue.png" alt="continue">
                <img id="score-retry" class="retry-btn" src="../assets/hud/game/gameover/retry.png" alt="retry">
                <img id="score-home" class="home-btn" src="../assets/hud/game/gameover/home.png" alt="home">
            </div>
        </div>
    </div>

    <!-- ====================================================== -->
    <!-- =================== MODAL DIALOG ====================== -->
    <!-- ====================================================== -->

    <div id="modal-dialog" class="welcome-screen" style="display: none; z-index: 60000;">
        <div class="welcome-card">
            <img src="../assets/hud/menu/welcome.png" class="welcome-bg" alt="Dialog">
            <div class="welcome-content">
                <div id="modal-text" class="welcome-text"></div>
                <div class="welcome-buttons">
                    <button id="modal-ok" class="welcome-btn welcome-yes">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ====================================================== -->
    <!-- =================== LEVEL START MODAL ================= -->
    <!-- ====================================================== -->

    <div id="level-start-modal" class="level-start-overlay" style="display: none;">
        <div class="level-start-card">
            <img src="../assets/hud/menu/welcome.png" class="level-start-bg" alt="Level Start">
            <div class="level-start-content">
                <div id="level-start-title" class="level-start-title"></div>
                <div id="level-start-seed" class="level-start-seed"></div>
                <div id="level-start-info" class="level-start-info"></div>
                <div id="level-start-children" class="level-start-children"></div>
            </div>
        </div>
    </div>

    <!-- ====================================================== -->
    <!-- =================== PAUSE MODAL ======================= -->
    <!-- ====================================================== -->

    <div id="pause-modal" class="pause-overlay" style="display: none;">
        <div class="pause-card">
            <img src="../assets/hud/menu/welcome.png" class="pause-bg" alt="Pause Menu">
            <div class="pause-content">
                <div id="pause-title" class="pause-title">PAUSED</div>
                <div id="pause-stats" class="pause-stats"></div>
                <div id="pause-children" class="pause-children"></div>
                <div class="pause-buttons">
                    <img id="pause-continue" class="pause-btn-img" src="../assets/hud/game/control/continuegame.png" alt="Continue">
                    <img id="pause-exit" class="pause-btn-img" src="../assets/hud/game/control/exit.png" alt="Exit">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
